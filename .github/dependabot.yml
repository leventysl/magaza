# Haftalık bağımlılık güncellemeleri: GitHub Actions + her uygulamanın npm paketleri.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule: { interval: "weekly" }
    groups:
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "react", "react-native", "react-native-*"]
  - package-ecosystem: "npm"
    directory: "/apps/backend"
    schedule: { interval: "weekly" }
    groups:
      medusa:
        patterns: ["@medusajs/*"]
