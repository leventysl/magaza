# Mobil uygulama: lint, tip, test, bagimlilik denetimi, proje sagligi (standartlar/expo.md).
name: ci-mobil
on:
  push:
    paths: ["apps/mobile/**", "scripts/**", ".github/workflows/ci-mobil.yml"]
  pull_request:
    paths: ["apps/mobile/**", "scripts/**", ".github/workflows/ci-mobil.yml"]
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/mobile
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: npx jest --ci
      - run: node ../../scripts/denetim.mjs
      - run: npx expo-doctor
